title = "MaiPai Bot gitleaks config"

# Extends gitleaks' own default rule set (no rules redefined here) - this
# file exists only to skip one known false positive, never to weaken
# detection.
[extend]
useDefault = true

# `body/maipai_body/bodies/reachy_mini/fixtures/README.md` documents the
# sha256 checksum of the recorded `openapi.json` fixture (a public
# schema fetched from a local simulator, never a credential). The 64
# hex character checksum trips gitleaks' entropy-based generic-api-key
# rule; every future fixture recording will produce a different hash in
# the same spot, so this allowlists the file, not today's specific
# value.
#
# `gitleaks dir` scans the filesystem, not git, so it also reads the git-ignored data-scratch/. Found 2026-10-20: a wt.sh
# gate stamp there lists changed files with their blob shas, and an entry like "body/maipai_body/settings_keys.py": "<sha>"
# reads as a generic API key. Same fix as commons 5253ac5; the pattern is anchored to a path segment.
[allowlist]
paths = [
  '''(^|/)data-scratch(/|$)''',
  '''(^|/)bodies/reachy_mini/fixtures/README\.md$''',
]
