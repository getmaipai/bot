[project]
# Named to match the entry point (`maipai_bot`, registered below), not
# the importable module (`maipai_body/`, unaffected by this rename): a
# code review (2026-09-27, docs/dev/reachy-mini-gap-audit-2026-09-27.md
# 1.3/G12) found the two names disagreeing meant the daemon's own
# uninstall/update (`pip`/`uv uninstall <entry point>`) silently no-ops
# against our own app the same way it can against a vendor app whose
# entry point and distribution names don't match.
name = "maipai-bot"
version = "0.1.0"
description = "MaiPai Bot: the Python body that owns hardware behind the HAL seam, one profile per supported body."
requires-python = ">=3.12"
dependencies = [
    "reachy-mini==1.11.0",
    "pydantic>=2.13,<3",
    "websockets>=15.0,<16",
    "requests>=2.34,<3",
    # G1: the seam's AudioIO protocol and body/maipai_body/speech/ use
    # numpy arrays directly (float32 audio samples), not just through
    # reachy-mini's own transitive pin - declared explicitly so a future
    # reachy-mini version bump can't silently drop or reversion it under us.
    "numpy>=2.0,<3",
    # AGENTS.md names maipai-spec, pinned at the same tag Home pins
    # (spec-v0.1.73), as this body's dependency once it consumes spec
    # shapes. Not pinned yet: commons/spec/pyproject.toml has no
    # [build-system] table, so `pip`/`uv` fall back to setuptools'
    # legacy flat-layout autodiscovery over the whole spec/ workspace
    # and refuse to build ("Multiple top-level packages discovered":
    # ui, llm, gen, vocab, voice, stack, safety, errors, records,
    # schemas, settings, fixtures, emulators, streaming, diagnostics,
    # interpreters) -- nobody has made this git-installable pattern
    # work yet. RM-01 needs no spec shapes (the HAL seam's own pydantic
    # models are self-contained; household-record shapes are RT-00
    # onward, which AGENTS.md already says this repo waits on), so this
    # profile does not block on it. Add the pin back once commons/spec
    # ships real packaging metadata (a commons issue, not this repo's
    # to fix unilaterally).
]

[project.entry-points."reachy_mini_apps"]
maipai_bot = "maipai_body.app:MaiPaiBody"

# G12 (docs/dev/reachy-mini-gap-audit-2026-09-27.md): the bare
# `reachy-mini` dependency above never pulls the simulator (mujoco is a
# multi-hundred-MB extra with its own native deps, useless on the robot
# itself and previously installed onto it for no reason,
# install-reachy.sh's own comment already flagged this). The dev bench
# needs it: `uv run --extra sim reachy-mini-daemon --sim ...` (or `uv
# sync --extra sim` once, then plain `uv run ...`), not the bare `uv
# run reachy-mini-daemon` this repo's docstrings used to show.
[project.optional-dependencies]
sim = ["reachy-mini[mujoco]==1.11.0"]
# G2: wake-word scoring. Pulls onnxruntime, scikit-learn, scipy, requests
# and tqdm transitively - real weight on a CM4, so it's opt-in like `sim`,
# not a base dependency every body profile pays for whether or not it
# does its own audio. `uv sync --extra voice` for the dev bench; the
# robot's own install (scripts/install-reachy.sh) adds it explicitly.
# onnxruntime's own version is forced correct via [tool.uv]
# override-dependencies below, not pinned here - see that comment for why.
# G7: scipy.signal.resample_poly resamples the hub's own TTS voice rate
# to the daemon's 16kHz output (the gap-audit's own instruction: "a
# maintained resampler... never a hand-rolled one"). scipy already
# arrives transitively through openwakeword above; declared explicitly
# here too so a future openwakeword version dropping it as its own
# dependency can't silently break G7 underneath this group.
voice = ["openwakeword>=0.6.0,<0.7", "scipy>=1.14,<2"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16",
]

[tool.uv]
# reachy-mini==1.11.0 hard-pins onnxruntime==1.27.0. Verified on this
# machine (G2, 2026-09-28) that 1.27.0 silently mis-scores the wake-word
# pipeline's own ONNX models (near-zero on a clear "hey maipai" sample
# that 1.30.0 scores correctly at 0.94, no error either way - a version-
# caused false negative, not a crash). Also verified reachy-mini's own
# bundled kinematics models (fknetwork.onnx, iknetwork.onnx) produce
# byte-identical output under 1.27.0 and 1.30.0, so its exact pin looks
# like "pin to what shipped with the model," not a real behavioral
# dependency - overriding it here is a deliberate, checked choice, not a
# guess. Not verified the same way: reachy_mini/vision/face_detector.py's
# own onnx model (no consumer built yet, G11's own scope).
override-dependencies = ["onnxruntime==1.30.0"]
# reachy-mini pulls PyGObject only under sys_platform == "linux" (a
# gstreamer-bundle wheel covers macOS and Windows instead); universal
# locking still tries to resolve PyGObject's metadata by building its
# sdist with this host's toolchain, which fails on a bench Mac with no
# cairo/pkg-config installed. RM-01's bench is the dev Mac
# (docs/dev/design-reachy-mini-2026-09-27.md section 12: "the simulator
# is the bench until the unit arrives"); the robot's own Linux install
# goes through RM-03's wheel and scripts/install-reachy.sh, not this
# lockfile, so scoping resolution to darwin is honest, not a workaround.
environments = ["sys_platform == 'darwin'"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit_only: needs the physical Reachy Mini (MAIPAI_UNIT=1 and a non-simulator daemon on port 8000)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["maipai_body"]
